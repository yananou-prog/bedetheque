@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});

function toCanvas(file, W){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const s = Math.min(1, W / img.width);
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
async function storePhoto(file){
  const c = await toCanvas(file, 400); return c.toDataURL("image/jpeg", .75);
}

const net = {};
const host = u => { try { return new URL(u).hostname; } catch(e){ return u; } };
const SITE = {"catalogue.bnf.fr": "BnF", "www.googleapis.com": "Google Books", "openlibrary.org": "Open Library", "covers.openlibrary.org": "image Open Library", "images-na.ssl-images-amazon.com": "image Amazon", "books.google.com": "image Google"};
const cspBlocked = new Set();

async function getJSON(url, type = "json"){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 9000), h = host(url);
  try { const r = await fetch(url, {signal: ctl.signal}); net[h] = r.ok ? "répond" : "erreur " + r.status; if (!r.ok) return null; return type === "json" ? await r.json() : await r.text(); }
  catch(e){ net[h] = ctl.signal.aborted ? "trop lent" : "bloqué"; return null; } finally { clearTimeout(tm); }
}
const netReport = () => Object.entries(net).map(([h, st]) => `${SITE[h] || h} : ${cspBlocked.has(h) ? "bloqué par la page" : st}`).join(" · ");
const clean = s => String(s || "").replace(/\s+/g, " ").replace(/\s*[:;,/.]\s*$/, "").trim();
// "Blacksad. 6. Alors, tout tombe" ou "Blacksad - Tome 6 - Alors, tout tombe" → série, tome, titre
function splitTitle(t){
  t = clean(t);
  const m = t.match(/^(.+?)\s*(?:[-–.]|,\s*tome)\s*(?:tome|t\.|vol\.?|volume)?\s*(\d{1,3})\s*(?:[-–.,:]\s*(.+))?$/i);
  if (m && m[1].length < 80) return {serie: clean(m[1]), tome: +m[2], titre: clean(m[3] || "")};
  return {titre: t};
}
function frName(s){ // "Díaz Canales, Juan (1972-....). Auteur du texte" → "Juan Díaz Canales"
  s = String(s).replace(/\(.*?\)/g, "").replace(/\.\s*[A-ZÉ][^.]*$/, "").trim();
  const [nom, pre] = s.split(/\s*,\s*/); return clean(pre ? pre + " " + nom : nom);
}
async function fromBnf(ean){
  const xml = await getJSON(`https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&maximumRecords=3&recordSchema=dublincore&query=${encodeURIComponent(`bib.isbn all "${ean}"`)}`, "text");
  if (!xml) return null;
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const rec = doc.getElementsByTagNameNS("*", "dc")[0]; if (!rec) return null;
  const all = n => [...rec.getElementsByTagNameNS("*", n)].map(x => x.textContent.trim());
  const title = (all("title")[0] || "").split(" / ")[0]; if (!title) return null;
  const auteurs = all("creator").filter(c => !/coloris|tradu|lettr|préfac|éditeur/i.test(c)).map(frName).filter(Boolean);
  return {...splitTitle(title), auteurs: [...new Set(auteurs)].slice(0, 3).join(" & "), annee: (all("date").join(" ").match(/\d{4}/) || [""])[0], src: "BnF"};
}
async function fromGoogle(ean){
  const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:${ean}`);
  const v = j?.items?.[0]?.volumeInfo; if (!v) return null;
  const st = splitTitle(v.title);
  if (!st.titre && v.subtitle) st.titre = clean(v.subtitle);
  let cover = v.imageLinks?.thumbnail || v.imageLinks?.smallThumbnail;
  if (cover) cover = cover.replace(/^http:/, "https:").replace(/&edge=curl/, "");
  return {...st, auteurs: (v.authors || []).slice(0, 3).join(" & "), annee: (String(v.publishedDate || "").match(/\d{4}/) || [""])[0], cover, src: "Google Books"};
}
async function fromOpenLibrary(ean){
  const j = await getJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${ean}&format=json&jscmd=data`);
  const v = j?.["ISBN:" + ean]; if (!v) return null;
  return {...splitTitle(v.title), auteurs: (v.authors || []).map(a => a.name).slice(0, 3).join(" & "), annee: (String(v.publish_date || "").match(/\d{4}/) || [""])[0], src: "Open Library"};
}
function isbn10(ean){ if (!/^978\d{10}$/.test(ean)) return null; const b = ean.slice(3, 12);
  const c = (11 - [...b].reduce((a, d, i) => a + d * (10 - i), 0) % 11) % 11; return b + (c === 10 ? "X" : c); }
// charge l'image pour vérifier qu'elle existe vraiment (Amazon renvoie un pixel transparent quand il n'a rien)
function probe(url){ return new Promise(res => { const i = new Image(), h = host(url); i.referrerPolicy = "no-referrer";
  const tm = setTimeout(() => { net[h] = "trop lent"; res(false); }, 9000);
  i.onload = () => { clearTimeout(tm); const ok = i.naturalWidth > 40 && i.naturalHeight > 40; net[h] = ok ? "image trouvée" : "pas d'image"; res(ok); };
  i.onerror = () => { clearTimeout(tm); net[h] = "pas d'image ou bloqué"; res(false); }; i.src = url; }); }
const lookCache = new Map();
function lookupEan(ean, fresh){
  if (fresh) lookCache.delete(ean);
  if (lookCache.has(ean)) return lookCache.get(ean);
  const p = (async () => {
    const [bnf, gb, ol] = await Promise.all([fromBnf(ean), fromGoogle(ean), fromOpenLibrary(ean)]);
    const srcs = [bnf, gb, ol].filter(Boolean), pick = k => srcs.find(s => s[k])?.[k] || null;
    const info = srcs.length ? {titre: pick("titre"), serie: pick("serie"), tome: pick("tome"), auteurs: pick("auteurs"), annee: pick("annee"), src: srcs.find(s => s.titre || s.serie)?.src} : null;
    const i10 = isbn10(ean);
    // Amazon d'abord : bonne couverture des BD franco-belges et images plus nettes que les vignettes Google
    const cands = [[i10 && `https://images-na.ssl-images-amazon.com/images/P/${i10}.08.LZZZZZZZ.jpg`, "Amazon"],
      [`https://covers.openlibrary.org/b/isbn/${ean}-L.jpg?default=false`, "Open Library"], [gb?.cover, "Google"]].filter(c => c[0]);
    const ok = await Promise.all(cands.map(c => probe(c[0])));
    return {info, covers: cands.filter((c, i) => ok[i]).map(([url, src]) => ({url, src}))};
  })();
  lookCache.set(ean, p);
  return p;
}

function coverHTML(b, withBubble){

  let bub = "";
  if (withBubble && b.chez){ const n = daysSince(b.depuis);
    bub = `<div class="bubble ${n >= LATE ? "late" : ""}">Chez ${esc(mname(b.chez))} ${n === 0 ? "depuis aujourd'hui" : "· " + n + " j"}</div>`; }
  const todo = withBubble && b.ean && (!b.titre && !b.serie || !b.auteur || !b.couv) ? `<span class="todo">À compléter</span>` : "";

function loanRow(b, who){ const n = daysSince(b.depuis);

function renderLoans(main){
  const out = books.filter(b => b.chez).filter(match).sort((a,b) => a.depuis.localeCompare(b.depuis));
  let html;
  if (!out.length) html = `<div class="empty"><h2>Toutes les BD sont à la maison</h2><p>Quand quelqu'un prête un album, il apparaît ici avec l'emprunteur et le nombre de jours écoulés.</p></div>`;
  else if (meId && mem(meId)){
    const lent = out.filter(b => b.proprio === meId), borrowed = out.filter(b => b.chez === meId), others = out.filter(b => b.proprio !== meId && b.chez !== meId);
    const col = (title, arr, fn) => `<section class="col"><h3>${title}</h3>${arr.length ? arr.map(fn).join("") : `<p class="none">Rien en ce moment.</p>`}</section>`;
    html = `<div class="loans">
      ${col("J'ai prêté", lent, b => loanRow(b, "chez " + esc(mname(b.chez))))}
      ${col("J'ai emprunté", borrowed, b => loanRow(b, "à " + esc(mname(b.proprio))))}
      ${others.length ? col("Entre les autres", others, b => loanRow(b, esc(mname(b.proprio)) + " → " + esc(mname(b.chez)))) : ""}</div>`;
  } else html = `<div class="loans"><section class="col"><h3>Prêts en cours</h3>${out.map(b => loanRow(b, esc(mname(b.proprio)) + " → " + esc(mname(b.chez)))).join("")}</section></div>`;
  main.innerHTML = html;

}

function exportJSON(){
  const data = {format: "bedetheque-1", exporte: today(), membres: {}, livres: {}};
  members.forEach(({id, ...m}) => data.membres[id] = m); books.forEach(({id, ...b}) => data.livres[id] = b);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type: "application/json"}));
  a.download = `sauvegarde-bedetheque-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
}
async function importJSON(file){
  let data; try { data = JSON.parse(await file.text()); } catch(e){ return toast("Ce fichier n'est pas une sauvegarde de La Bédéthèque."); }
  if (data?.format !== "bedetheque-1") return toast("Ce fichier n'est pas une sauvegarde de La Bédéthèque.");
  const writes = [...Object.entries(data.membres || {}).map(([id, m]) => ["membres/" + id, {...m, uid: members.find(x => x.id === id)?.uid || null}]),
    ...Object.entries(data.livres || {}).map(([id, b]) => ["livres/" + id, b])];
  try { for (let i = 0; i < writes.length; i += 20){ const batch = db.batch();
      writes.slice(i, i + 20).forEach(([path, d]) => batch.set(db.doc(path), d)); await batch.commit(); }
    toast(`${Object.keys(data.livres || {}).length} albums repris`); } catch(e){ fail(e); }
}
const importBtn = () => `<label class="btn" for="imp">Reprendre une sauvegarde</label><input type="file" id="imp" accept=".json,application/json" hidden>`;

      const setUrl = async u => { u = String(u || "").trim(); if (!/^https:\/\/\S+$/i.test(u)) return u && toast("Colle une adresse qui commence par https://");
        $("#prev").textContent = "Chargement…";
        if (await probe(u)){ showCouv(u); $("#burl").value = ""; } else { showCouv(couv); toast("Cette adresse ne mène pas à une image."); } };
      let looked = b?.ean || "";
      const lookup = async (force) => {
        const e = normEan($("#be").value); if (!eanOk(e)) { if (force) qs("Il faut un code EAN valide (13 chiffres) pour chercher en ligne."); return null; }
        if (!force && e === looked) return null; looked = e;
        qs("Recherche de l'album en ligne…"); $("#look").disabled = true;
        const r = await lookupEan(e, force);
        if (!document.contains(sheet)) return r;
        $("#look").disabled = false;
        if (normEan($("#be").value) !== e) return r;
        $("#cands").innerHTML = r.covers.map(c => `<button type="button" class="cand" data-url="${esc(c.url)}" aria-pressed="${c.url === couv}"><img src="${esc(c.url)}" alt="" referrerpolicy="no-referrer">${esc(c.src)}</button>`).join("");
        $("#cands").querySelectorAll(".cand").forEach(c => c.onclick = () => showCouv(c.dataset.url));
        const replaceable = !couv || couv.startsWith("data:") || force;
        if (r.covers.length && replaceable && !r.covers.some(c => c.url === couv)) showCouv(r.covers[0].url);
        const n = fill(r.info);
        const parts = [];
        if (r.info) parts.push(n ? `Fiche trouvée (${r.info.src || "en ligne"}), ${n} champ${n > 1 ? "s" : ""} rempli${n > 1 ? "s" : ""}` : `Fiche trouvée (${r.info.src || "en ligne"})`);
        parts.push(r.covers.length ? (r.covers.length > 1 ? `${r.covers.length} couvertures au choix` : "couverture trouvée") : "pas de couverture en ligne : colle l'adresse d'une image ou prends une photo (" + netReport() + ")");
        qs(r.info || r.covers.length ? parts.join(", ") + ". Vérifie avant d'enregistrer." : "Rien trouvé en ligne pour ce code. Remplis à la main ou photographie la couverture. Détail : " + netReport());
        $("#ctip").hidden = r.covers.length > 0;
        return r;
      };
      const upd = () => { const q = [$("#bs").value, $("#bn").value && "tome " + $("#bn").value, $("#bt").value || $("#be").value, "bd couverture"].filter(Boolean).join(" ");
        $("#gimg").href = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(q); };
      const checkDup = () => { const e = normEan($("#be").value); const d = e && books.find(x => x.ean === e && x.id !== b?.id);
        $("#dup").innerHTML = d ? `<div class="notice">Déjà dans la bibliothèque de <b>${esc(mname(d.proprio))}</b> : ${esc(tomeLbl(d) || d.titre)}${d.serie && d.titre ? " · " + esc(d.titre) : ""}.</div>` : ""; };
      ["#bs","#bn","#bt","#be"].forEach(k => $(k).addEventListener("input", upd)); upd();
      $("#be").addEventListener("input", () => { checkDup(); lookup(); }); checkDup();
      $("#look").onclick = () => lookup(true);
      if (b?.ean && !b.couv) lookup(true);
      $("#burl").addEventListener("change", e => setUrl(e.target.value));
      const fill = info => { if (!info) return 0; let n = 0;
        const put = (sel, val) => { if (val == null || val === "") return; const el = $(sel); if (!el.value.trim()){ el.value = String(val); n++; } };
        put("#bt", info.titre); put("#bs", info.serie); put("#bn", Number(info.tome) || ""); put("#ba", info.auteurs); put("#by", /^\d{4}$/.test(String(info.annee||"")) ? info.annee : "");
        const e = normEan(String(info.ean || "")); if (e && eanOk(e) && !$("#be").value.trim()){ $("#be").value = e; n++; }
        upd(); checkDup(); return n; };

      wireReview("fv");

      $("#scan-file").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
        qs("Lecture du code-barres…");
        const code = await readBarcode(f);
        if (!code) return qs("Code-barres illisible. Rapproche-toi, évite les reflets, ou tape les 13 chiffres.");
        $("#be").value = code; checkDup(); upd();
        await lookup(true);
      };
      $("#front-file").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
        await setCouv(f); qs("Photo gardée comme couverture.");
      };
      $("#bf-file").onchange = e => setCouv(e.target.files[0]);
      $("#rmc").addEventListener("click", () => showCouv(null));
      const drop = $("#drop");
      drop.ondragover = e => e.preventDefault(); drop.ondrop = e => { e.preventDefault(); setCouv(e.dataTransfer.files[0]); };
      sheet.addEventListener("paste", e => { const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/")); if (it){ e.preventDefault(); setCouv(it.getAsFile()); return; }
        const txt = e.clipboardData?.getData("text") || ""; if (e.target === $("#burl") && /^https:\/\//i.test(txt.trim())){ e.preventDefault(); setUrl(txt); } });
      $("#bcancel").onclick = () => b ? showBook(b.id) : closeModal();
      $("#bf").onsubmit = async e => { e.preventDefault();
        const next = e.submitter?.dataset.next === "1";
        const ean = normEan($("#be").value);
        if (ean && !eanOk(ean)) return qs("Ce code EAN ne semble pas valide : vérifie les 13 chiffres.");
        if (!$("#bt").value.trim() && !$("#bs").value.trim() && !ean) return qs("Indique au moins un titre, une série ou un code EAN.");
        sheet.querySelectorAll("[type=submit]").forEach(x => x.disabled = true);
        const data = { titre: $("#bt").value.trim(), serie: $("#bs").value.trim(), tome: $("#bn").value.trim() ? Number($("#bn").value) : "", auteur: $("#ba").value.trim(), annee: $("#by").value.trim(), ean, proprio: $("#bo").value, couv };
        const rv = readReview("fv", (b?.avis || {})[meId]);
        try {
          if (b){ await db.doc("livres/" + b.id).update(rv ? {...data, ["avis." + meId]: rv} : data); showBook(b.id); toast("Album mis à jour"); }
          else { const ref = db.collection("livres").doc(); await ref.set({...data, avis: rv ? {[meId]: rv} : {}, chez: null, depuis: null, historique: [], ajoute: Date.now()});
            toast("Ajouté à l'étagère de " + mname(data.proprio));
            if (next) editBook(null, data.proprio); else closeModal(); }
        } catch(err){ sheet.querySelectorAll("[type=submit]").forEach(x => x.disabled = false); fail(err); } };
    });
}

/* ---------- Avis ---------- */
const starCell = (i, v) => `<span class="st"><span class="bg">★</span><span class="fg" style="width:${Math.max(0, Math.min(1, v - i + 1)) * 100}%">★</span></span>`;
const noteTxt = v => String(v).replace(".", ",");
const roStars = n => { n = Math.round((Number(n) || 0) * 2) / 2; return `<span class="ro-stars" aria-label="${noteTxt(n)} sur 5">${[1,2,3,4,5].map(i => starCell(i, n)).join("")}</span>`; };
function avgNote(b){ const n = Object.values(b.avis || {}).filter(r => r?.lu && Number.isFinite(r.note)).map(r => r.note);
  return n.length ? {moy: n.reduce((a,x) => a+x, 0) / n.length, nb: n.length} : null; }
function reviewForm(b, prefix){
  const r = (b?.avis || {})[meId] || {};
  return `<fieldset class="review"><legend>Avis de ${esc(mname(meId))}</legend>
    <label class="check"><input type="checkbox" id="${prefix}-lu" ${r.lu ? "checked" : ""}> Je l'ai lu</label>
    <div id="${prefix}-body" class="members" ${r.lu ? "" : "hidden"}>
      <div class="field"><label>Ma note</label><div class="stars" id="${prefix}-stars" data-v="${r.note ?? 0}" role="slider" tabindex="0" aria-label="Note sur 5" aria-valuemin="0" aria-valuemax="5"></div></div>
      <div class="field"><label for="${prefix}-txt">Mon avis</label><textarea id="${prefix}-txt" rows="3" maxlength="2000" placeholder="Ce que tu en as pensé, à qui tu le conseillerais…">${esc(r.texte)}</textarea></div>
    </div></fieldset>`;
}
function wireReview(prefix){
  const box = $("#" + prefix + "-stars"); if (!box) return;
  const set = v => { box.dataset.v = Math.max(0, Math.min(5, v)); draw(); };
  const draw = () => { const v = +box.dataset.v;
    box.setAttribute("aria-valuenow", v); box.setAttribute("aria-valuetext", noteTxt(v) + " sur 5");
    box.innerHTML = [1,2,3,4,5].map(i => `<button type="button" tabindex="-1" data-i="${i}" aria-hidden="true">${starCell(i, v)}</button>`).join("") + `<small>${noteTxt(v)}/5</small>`;
    box.querySelectorAll("button").forEach(bt => bt.onclick = e => {
      const r = bt.getBoundingClientRect(), half = (e.clientX || r.right) - r.left < r.width / 2;
      const nv = +bt.dataset.i - (half ? .5 : 0); set(+box.dataset.v === nv ? 0 : nv); }); };
  box.onkeydown = e => { const v = +box.dataset.v;
    if (e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); set(v + .5); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); set(v - .5); }
    else if (e.key === "Home"){ e.preventDefault(); set(0); } else if (e.key === "End"){ e.preventDefault(); set(5); } };
  draw();
  $("#" + prefix + "-lu").onchange = e => { $("#" + prefix + "-body").hidden = !e.target.checked; };
}
function readReview(prefix, prev){
  if (!$("#" + prefix + "-lu")) return null;
  if (!$("#" + prefix + "-lu").checked) return prev?.lu ? {lu: false, note: null, texte: "", date: today()} : null;
  return {lu: true, note: +$("#" + prefix + "-stars").dataset.v, texte: $("#" + prefix + "-txt").value.trim(), date: today()};
}
function reviewsBox(b){
  const list = members.map(m => [m, (b.avis || {})[m.id]]).filter(([m, r]) => r?.lu && m.id !== meId);
  const borrowing = b.chez === meId && !(b.avis || {})[meId]?.lu;
  return `<section class="revs">
    ${list.length ? `<div class="field"><label>Avis des potes</label></div>${list.map(([m, r]) => `<div class="rev" style="--c:${m.couleur}">
      <header><b>${esc(m.nom)}</b>${roStars(r.note || 0)}<small>${r.date ? fmtDate(r.date) : ""}</small></header>
      ${r.texte ? `<p>${esc(r.texte)}</p>` : `<small>Lu, sans commentaire.</small>`}</div>`).join("")}` : ""}
    ${writable && meId && mem(meId) ? `${borrowing ? `<div class="hint">Tu as cet album en ce moment : coche « Je l'ai lu » quand tu l'as fini et donne ton avis.</div>` : ""}
      ${reviewForm(b, "dv")}<div class="actions"><button class="btn" id="dv-save">Enregistrer mon avis</button></div>` : ""}
  </section>`;
}

/* ---------- Code-barres ---------- */
function normEan(s){ s = String(s||"").replace(/[^0-9Xx]/g, "").toUpperCase();
  if (/^\d{9}[\dX]$/.test(s)){ const c = "978" + s.slice(0,9); return c + ((10 - [...c].reduce((a,d,i) => a + d*(i%2?3:1), 0) % 10) % 10); }
  return s; }
function eanOk(s){ return /^\d{13}$/.test(s) && (10 - [...s.slice(0,12)].reduce((a,d,i) => a + d*(i%2?3:1), 0) % 10) % 10 === +s[12]; }
function loadImage(file){ return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => res({img, url}); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); }; img.src = url; }); }
async function readBarcode(file){
  let im; try { im = await loadImage(file); } catch(e){ return null; }
  const {img, url} = im;
  try {
    if ("BarcodeDetector" in window){ try { const det = new BarcodeDetector({formats: ["ean_13"]}); const r = await det.detect(img); const c = r.map(x => x.rawValue).find(eanOk); if (c) return c; } catch(e){} }
    if (!window.ZXing) return null;
    const hints = new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]], [ZXing.DecodeHintType.TRY_HARDER, true]]);
    const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
    const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
    // zones : image entière, centre, moitiés et quarts — le code-barres est souvent petit dans un coin du dos
    const zones = [[0,0,1,1],[.2,.2,.6,.6],[0,.5,1,.5],[0,0,1,.5],[.5,.5,.5,.5],[0,.5,.5,.5],[.5,0,.5,.5],[0,0,.5,.5],[.5,0,.5,1],[0,0,.5,1]];
    for (const [zx,zy,zw,zh] of zones) for (const max of [1200, 700]) for (const rot of [0, 90]) {
      const sw = W*zw, sh = H*zh, s = Math.min(1.5, max / Math.max(sw, sh)), w = Math.round(sw*s), h = Math.round(sh*s);
      const c = document.createElement("canvas"); c.width = rot ? h : w; c.height = rot ? w : h; const g = c.getContext("2d", {willReadFrequently: true});
      if (rot){ g.translate(h, 0); g.rotate(Math.PI/2); } g.drawImage(img, W*zx, H*zy, sw, sh, 0, 0, w, h);
      const lum = new ZXing.HTMLCanvasElementLuminanceSource(c);
      for (const Bin of [ZXing.HybridBinarizer, ZXing.GlobalHistogramBinarizer]) {
        try { const t = reader.decode(new ZXing.BinaryBitmap(new Bin(lum)), hints).getText(); if (eanOk(t)) return t; } catch(e){}
      }
      await new Promise(r => setTimeout(r, 0));
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
function seriesBox(b){
  if (!b.serie) return "";
  const same = books.filter(x => sKey(x.serie) === sKey(b.serie) && x.tome).sort(cmp);
  if (same.length < 2) return "";
  const have = new Set(same.map(x => Number(x.tome))), max = Math.max(...have);
  const miss = []; for (let i = 1; i <= max; i++) if (!have.has(i)) miss.push(i);
  return `<div class="series"><b>${esc(b.serie)} entre vous</b>
    <span>${same.map(x => `T.${x.tome} (${esc(mname(x.proprio))})`).join(", ")}</span>
    ${miss.length ? `<span class="miss">Personne n'a ${miss.length > 1 ? "les tomes" : "le tome"} ${miss.join(", ")}</span>` : `<span>Du tome 1 au tome ${max}, la série est complète entre vous.</span>`}</div>`;
}

function showBook(id){
  const b = books.find(x => x.id === id); if (!b) return closeModal();
  const n = b.chez ? daysSince(b.depuis) : 0;
  const others = members.filter(m => m.id !== b.proprio);
  const hist = (b.historique || []).slice(-5).reverse();
  openModal(`<div class="detail">
      <div>${coverHTML(b, false)}</div>
      <div class="facts">${b.serie ? `<span class="meta"><span class="s">${esc(tomeLbl(b))}</span></span>` : ""}<h2>${esc(b.titre || (b.serie ? "" : "Album à compléter"))}</h2>
        <span class="a">${esc(b.auteur || "Auteur inconnu")}${b.annee ? " · " + esc(b.annee) : ""}</span>
        <span class="owner"><span class="dot" style="background:${mcolor(b.proprio)}"></span>Bibliothèque de ${esc(mname(b.proprio))}</span>
        ${b.ean ? `<span class="owner" style="font-variant-numeric:tabular-nums">EAN ${esc(b.ean)}</span>` : ""}
      </div></div>
    ${seriesBox(b)}
    <div class="status ${b.chez ? "out" : "home"}">${b.chez
      ? `Prêté à <b>${esc(mname(b.chez))}</b> le ${fmtDate(b.depuis)}, ${dur(n)}.`
      : `À la maison, chez ${esc(mname(b.proprio))}.`}</div>
    ${writable ? (b.chez
      ? `<div class="actions" style="justify-content:flex-start"><button class="btn blue" id="ret">C'est rendu</button></div>`
      : `<form id="lend" class="two" style="align-items:end">
          <div class="field"><label for="lt">Prêter à</label><select id="lt">${others.map(m => `<option value="${m.id}">${esc(m.nom)}</option>`).join("")}</select></div>
          <div class="field"><label for="ld">Le</label><input type="date" id="ld" value="${today()}" max="${today()}"></div>
          <button class="btn blue" type="submit" style="grid-column:1/-1" ${others.length ? "" : "disabled"}>Prêter l'album</button></form>`) : ""}
    ${hist.length ? `<div><div class="field"><label>Derniers prêts</label></div><ul class="hist">${hist.map(h => `<li>${esc(mname(h.a))} : du ${fmtDate(h.du)} au ${fmtDate(h.au)}</li>`).join("")}</ul></div>` : ""}
    ${reviewsBox(b)}
    <div id="cf"></div>
    <div class="actions">${writable ? `<button class="btn ghost danger" id="del">Supprimer</button><button class="btn" id="ed">Modifier</button>` : ""}<button class="btn" id="close">Fermer</button></div>`,
    () => {
      $("#close").onclick = closeModal;
      wireReview("dv");
      $("#dv-save")?.addEventListener("click", async () => {
        const rv = readReview("dv", (b.avis || {})[meId]); if (!rv) return toast("Coche « Je l'ai lu » pour donner ton avis.");
        $("#dv-save").disabled = true;
        try { await db.doc("livres/" + b.id).update({["avis." + meId]: rv}); toast(rv.lu ? "Avis enregistré" : "Avis retiré"); showBook(b.id); }
        catch(e){ $("#dv-save").disabled = false; fail(e); } });
      $("#ed")?.addEventListener("click", () => editBook(b.id));
      $("#del")?.addEventListener("click", () => {
        $("#cf").innerHTML = `<div class="confirm"><span style="flex:1;min-width:0">Supprimer « ${esc(b.titre)} » de la bibliothèque ?</span><button class="btn" id="no">Garder</button><button class="btn danger" id="yes">Supprimer</button></div>`;
        $("#no").onclick = () => $("#cf").innerHTML = "";
        $("#yes").onclick = async () => { try { await db.doc("livres/" + b.id).delete(); closeModal(); toast("Album supprimé"); } catch(e){ fail(e); } };
      });
      $("#ret")?.addEventListener("click", async () => {
        const h = [...(b.historique || []), {a: b.chez, du: b.depuis, au: today()}].slice(-20);
        try { await db.doc("livres/" + b.id).update({chez: null, depuis: null, historique: h}); toast("Retour à la maison"); showBook(b.id); } catch(e){ fail(e); }
      });
      $("#lend")?.addEventListener("submit", async e => { e.preventDefault();
        const to = $("#lt").value, d = $("#ld").value || today();
        try { await db.doc("livres/" + b.id).update({chez: to, depuis: d}); toast("Prêté à " + mname(to)); showBook(b.id); } catch(err){ fail(err); } });
    });
}

$("#q").addEventListener("input", e => { query = e.target.value.trim(); renderMain(); });
$("#addBtn").addEventListener("click", () => editBook());

/* ---------- Démarrage ---------- */
function loginScreen(msg){
  $("#toolbar").hidden = true; $("#me").innerHTML = ""; notice("");
  $("#main").innerHTML = `<div class="empty"><h2>Entre dans la bibliothèque</h2>
    <p>Connecte-toi avec ton compte Google pour voir les étagères des potes, emprunter et donner ton avis.</p>
    <button class="btn primary" id="login">Se connecter avec Google</button>${msg ? `<p>${esc(msg)}</p>` : ""}</div>`;
  $("#login").onclick = async () => { const auth = firebase.auth(), prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({prompt: "select_account"});
    try { await auth.signInWithPopup(prov); }
    catch(e){ if (e?.code === "auth/popup-blocked" || e?.code === "auth/operation-not-supported-in-this-environment") return auth.signInWithRedirect(prov);
      if (e?.code !== "auth/popup-closed-by-user" && e?.code !== "auth/cancelled-popup-request") loginScreen("La connexion n'a pas marché (" + (e?.code || e) + ")."); } };
}
function start(){
  if (!window.firebase || FIREBASE_CONFIG.apiKey === "A_REMPLIR"){
    $("#main").innerHTML = `<div class="empty"><h2>Bibliothèque pas encore branchée</h2><p>Il manque la configuration Firebase en haut du fichier index.html.</p></div>`; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => {
    unsub.forEach(f => f()); unsub = []; members = []; books = []; closeModal();
    authUser = u; uid = u?.uid || null; writable = true; denied = false;
    if (!u) return loginScreen();
    notice(""); $("#main").innerHTML = `<div class="empty"><h2>Ouverture de la bibliothèque…</h2></div>`;
    let gotM = false, gotB = false;
    unsub.push(db.collection("membres").orderBy("ordre").onSnapshot(s => { members = s.docs.map(d => ({id: d.id, ...d.data()})); gotM = true; if (gotB) render(); }, fail));
    unsub.push(db.collection("livres").onSnapshot(s => { books = s.docs.map(d => ({id: d.id, ...d.data()})); gotB = true; if (gotM) render(); }, fail));
  });
}
start();
})();
</script>
